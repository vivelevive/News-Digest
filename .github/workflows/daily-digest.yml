name: Daily News Digest

on:
  schedule:
    # 19:00 UTC = 05:00 AEST / 06:00 AEDT (Sydney early morning)
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python scripts/build_digest.py

      - name: Commit updated digest
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/digest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily digest ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
