<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Digest</title>
<meta name="description" content="Daily curated news digest, grouped by topic.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="meta-row">
      <h1>📰 News Digest</h1>
      <span id="updated">loading…</span>
    </div>
    <div id="status-banner"></div>
  </div>
  <nav class="topic-nav" id="topic-nav" aria-label="Jump to topic"></nav>
</header>

<main id="main">
  <div class="card-list" id="loading-skeleton">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer class="app-footer">
  Built for personal use · sources linked belong to their original publishers · updates daily via GitHub Actions
</footer>

<script src="app.js"></script>
</body>
</html>
